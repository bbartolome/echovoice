<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2e6be6">
  <link rel="manifest" href="manifest.json">
  <title>EchoVoice</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=18">
</head>
<body>
  <div id="scaler">
    <div id="app" data-theme="light" data-density="default">

      <!-- Rows 1-5: the view area. Content depends on the active view — the
           spelling grid (Spell), or a header + tile board (Needs / Phrases).
           No trailing action buttons here; every action lives on the bottom
           actions row. -->
      <div class="comm-row" id="row-0">
        <div class="row-content" id="grid-r0"></div>
      </div>
      <div class="comm-row" id="row-1">
        <div class="row-content" id="grid-r1"></div>
      </div>
      <div class="comm-row" id="row-2">
        <div class="row-content" id="grid-r2"></div>
      </div>
      <div class="comm-row" id="row-3">
        <div class="row-content" id="grid-r3"></div>
      </div>
      <div class="comm-row" id="row-4">
        <div class="row-content" id="grid-r4"></div>
      </div>

      <!-- Predictions row — part of the Spell view only; hidden while Needs
           or Phrases is showing (see [data-view] rule in app.css). -->
      <div class="comm-row" id="row-pred">
        <div class="row-content" id="pred-row"></div>
      </div>

      <!-- Message row: Backspace (left) · message + Speak · Clear (right). -->
      <div class="comm-row" id="row-msg">
        <button class="msg-side-btn" id="btn-backspace">
          <span class="act-glyph">⌫</span>
          <span class="act-label">Backspace</span>
        </button>
        <div class="row-content" id="msg-bar"></div>
        <button class="msg-side-btn" id="btn-clear">
          <span class="act-glyph">✕</span>
          <span class="act-label">Clear</span>
        </button>
      </div>

      <!-- Actions row: every action lives here. Settings is direct-tap only
           (a caregiver control) and Select is the scan actuator itself —
           neither is ever a scan target. -->
      <div class="comm-row" id="row-actions">
        <a class="action-btn act-settings" id="btn-settings" href="./admin/" title="Caregiver settings">
          <span class="act-glyph">⚙</span>
          <span class="act-label">Settings</span>
        </a>
        <button class="action-btn act-yes" id="btn-yes">
          <span class="act-glyph">✓</span>
          <span class="act-label">Yes</span>
        </button>
        <button class="action-btn act-no" id="btn-no">
          <span class="act-glyph">✗</span>
          <span class="act-label">No</span>
        </button>
        <button class="action-btn act-needs" id="btn-needs">
          <span class="act-glyph">▶</span>
          <span class="act-label">Needs</span>
        </button>
        <button class="action-btn act-phrases" id="btn-phrases">
          <span class="act-glyph">❝</span>
          <span class="act-label">Phrases</span>
        </button>
        <button class="action-btn act-spell" id="btn-spell">
          <span class="act-glyph">Aa</span>
          <span class="act-label">Spell</span>
        </button>
        <button class="action-btn act-select" id="btn-select">
          <span class="act-glyph">●</span>
          <span class="act-label">Select</span>
        </button>
      </div>

      <!-- Row 8: footer — not part of the scan sweep -->
      <div id="footer">
        <span id="footer-copy">EchoVoice · © 2026</span>
      </div>

    </div>
  </div>
  <script src="predictionary.min.js?v=18"></script>
  <script src="prediction.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
