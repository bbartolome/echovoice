<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2e6be6">
  <link rel="manifest" href="manifest.json">
  <title>EchoVoice</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../icon.svg">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=23">
</head>
<body>
  <div id="scaler">
    <div id="app" data-theme="light" data-density="default">

      <!-- Row 1: spelling grid row 1 + Settings (direct-tap only — never a scan target) -->
      <div class="comm-row" id="row-0">
        <div class="row-content" id="grid-r0"></div>
        <a class="row-action act-settings" id="btn-settings" href="./admin/" title="Caregiver settings">
          <span class="act-glyph">⚙</span>
          <span class="act-label">Settings</span>
        </a>
      </div>

      <!-- Row 2: spelling grid row 2 + Clear -->
      <div class="comm-row" id="row-1">
        <div class="row-content" id="grid-r1"></div>
        <button class="row-action act-clear" id="btn-clear">
          <span class="act-glyph">✕</span>
          <span class="act-label">Clear</span>
        </button>
      </div>

      <!-- Row 3: spelling grid row 3 + Yes -->
      <div class="comm-row" id="row-2">
        <div class="row-content" id="grid-r2"></div>
        <button class="row-action act-yes" id="btn-yes">
          <span class="act-glyph">✓</span>
          <span class="act-label">Yes</span>
        </button>
      </div>

      <!-- Row 4: spelling grid row 4 + No -->
      <div class="comm-row" id="row-3">
        <div class="row-content" id="grid-r3"></div>
        <button class="row-action act-no" id="btn-no">
          <span class="act-glyph">✗</span>
          <span class="act-label">No</span>
        </button>
      </div>

      <!-- Row 5: spelling grid row 5 + Scan / Pause -->
      <div class="comm-row" id="row-4">
        <div class="row-content" id="grid-r4"></div>
        <button class="row-action act-scan" id="btn-scan">
          <span class="act-label">Scan</span>
        </button>
      </div>

      <!-- Row 6: quick phrases / predictions + Needs -->
      <div class="comm-row" id="row-5">
        <div class="row-content" id="pred-row"></div>
        <button class="row-action act-needs" id="btn-needs">
          <span class="act-glyph">▶</span>
          <span class="act-label">Needs</span>
        </button>
      </div>

      <!-- Row 7: message bar (with embedded Speak) + Select / Backspace.
           Never a scan target itself — pressing Select while scanning speaks the
           message immediately; while idle it becomes Backspace. -->
      <div class="comm-row" id="row-6">
        <div class="row-content" id="msg-bar"></div>
        <button class="row-action act-select" id="btn-select">
          <span class="act-glyph">⌫</span>
          <span class="act-label">Backspace</span>
        </button>
      </div>

      <!-- Row 8: footer — not part of the scan sweep -->
      <div id="footer">
        <span id="footer-copy">EchoVoice · © 2026</span>
      </div>

    </div>
  </div>
  <script src="predictionary.min.js?v=23"></script>
  <script src="prediction.js?v=23"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
